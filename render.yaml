services:
  - type: web
    name: nexus-bi-backend
    env: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_PATH
        value: ./data/warehouse.duckdb
      - key: MLFLOW_TRACKING_URI
        value: ./mlruns
